[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "fairscreen"
version = "1.0.0"
description = "Audit LLM-based CV screeners for bias with matched synthetic pairs"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["api/tests"]
pythonpath = ["api"]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["api"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"api/tests/*" = ["B011"]

[tool.mypy]
python_version = "3.14"
mypy_path = "api"
files = ["api/app", "api/scripts"]
exclude = ["api/tests"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
